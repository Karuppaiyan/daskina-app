services:
  db:
    image: postgres:16
    container_name: daksina-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: daksina
      POSTGRES_PASSWORD: daksina123
      POSTGRES_DB: daksina_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daksina -d daksina_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: daksina-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://daksina:daksina123@db:5432/daksina_erp
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npx prisma migrate deploy && npm run dev"

  pgadmin:
    image: dpage/pgadmin4
    container_name: daksina-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@daksina.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata: